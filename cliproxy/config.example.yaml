# CLIProxyAPI config for the new-api stack.
# Copy to cliproxy/config.yaml and change api-keys before starting.
# Upstream reference: https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml

host: ""
port: 8317

# OAuth credentials live here; mounted from ./cliproxy/auth on the host.
auth-dir: "/root/.cli-proxy-api"

# Keys clients must present. new-api stores one of these as the channel key.
api-keys:
  - "CHANGE-ME-new-api-channel-key"

debug: false

# Management API. Leave secret-key empty to disable it entirely.
remote-management:
  allow-remote: false
  secret-key: ""
